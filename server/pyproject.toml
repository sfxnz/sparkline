[project]
name = "sparkline"
version = "0.1.0"
description = "Sparkline — live telemetry & benchmarking for NVIDIA DGX Spark clusters"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "anyio>=4",  # imported directly (console stream task group); fastapi depends on it anyway
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "websockets>=12",
  "psutil>=5.9",
  "nvidia-ml-py>=12.560",
  "tool-eval-bench==2.8.0",  # the tool-eval benchmark; exact, as its scores only compare within one version
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
sparkline-agent = "sparkline.agent.main:main"
sparkline = "sparkline.console.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparkline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["sparkline"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["sparkline.common.*", "sparkline.console.*", "sparkline.agent.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["psutil", "psutil.*", "pynvml"]  # no type stubs shipped; not worth a stubs dependency
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Benchmark payloads run as scripts inside the PyTorch container: torch is not installed on the host, and
# benchlib (and llm_inference, for tool_eval) is imported as a sibling script, not as a sparkline module.
module = ["torch", "torch.*", "benchlib", "llm_inference"]
ignore_missing_imports = true
