# Sparkline console config, template for Docker Compose (install.sh console writes its own).
# Generate each token with:  python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
# Reference: README.md, "Configuration".

# "auto" = the private LAN IP of the default route. 0.0.0.0 and public addresses are refused.
bind = "auto"
port = 9700
# What you type on the sign-in screen. Or leave empty and set SPARKLINE_TOKEN.
token = ""
# Must equal token in /etc/sparkline/agent.toml on every node. Or leave empty and set SPARKLINE_AGENT_TOKEN.
agent_token = ""
# Optional: opens GET /metrics for Prometheus and nothing else. Put the same value in the file that the
# scrape job names as credentials_file. Reference: README.md, "Prometheus".
# metrics_token = ""

# The Will it fit? page can read a public model's size from https://huggingface.co when you press Look up.
# Set false on a site with no internet access: the model facts are then typed by hand.
# hf_lookup = true

# [settings]                  # also editable in the app (Settings)
# energy_rate_per_kwh = 0.28
# currency = "£"
# stale_after_s = 5.0
# offline_after_s = 30.0
# regression_pct = 5.0

# Alert notifications, one table per channel. kind: "ntfy", "discord", "slack" or "webhook".
# The url is a credential: keep this file private. Reference: README.md, "Notifications".
# [[notify]]
# name = "phone"
# kind = "ntfy"
# url = "https://ntfy.sh/<your-topic>"
# token = ""                  # ntfy and webhook only: sent as Authorization: Bearer
# min_severity = "warning"    # "info", "warning" or "critical"
# send_resolved = true        # also send when an alert clears

[[nodes]]
id = "spark1"
url = "http://192.168.1.11:9750"   # the agent's LAN address

[[nodes]]
id = "spark2"
url = "http://192.168.1.12:9750"
