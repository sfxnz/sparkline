# Drop-in for sparkline-agent.service, installed as
# /etc/systemd/system/sparkline-agent.service.d/10-benchmarks.conf by `install.sh agent --enable-benchmarks`
# and removed again when install.sh runs without that flag. Everything that benchmarks need beyond plain
# monitoring is in this one file.

[Service]
# GPU, memory-bandwidth, NCCL and thermal-soak payloads run in the PyTorch container through the Docker
# socket. The docker group is root-equivalent: anyone in it can start a privileged container. The agent
# only builds fixed, parameter-validated `docker run` argv lists, but a compromise of the agent would be a
# compromise of the host. That is why this is opt-in.
SupplementaryGroups=docker

# cpu-throughput, storage-fio, rdma-bw-lat, llm-inference, llm-showcase and tool-eval run as children of the
# agent, inside this cgroup. The monitoring caps in the main unit would throttle them and skew the results, so
# they are lifted here. The empty assignment resets CPUQuota. Memory stays capped well above what any payload
# needs.
CPUQuota=
MemoryHigh=infinity
MemoryMax=4G
TasksMax=1024

# perftest (ib_write_bw / ib_write_lat) registers memory with the RDMA NIC and needs to lock it.
LimitMEMLOCK=infinity
