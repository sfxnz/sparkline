name: Image

# Builds the console image for linux/amd64 and linux/arm64 and publishes it as ghcr.io/<owner>/sparkline.
# For a vX.Y.Z tag, it then creates the GitHub release vX.Y.Z from that version's CHANGELOG.md section, with
# the sparkline-X.Y.Z.tar.gz and SHA256SUMS assets that `sparkline update` installs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sparkline
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          deploy/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          deploy/release-tarball.sh "${TAG#v}" "$RUNNER_TEMP/assets" HEAD
          gh release create "$TAG" --verify-tag --title "Sparkline ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/assets/sparkline-${TAG#v}.tar.gz" "$RUNNER_TEMP/assets/SHA256SUMS"
